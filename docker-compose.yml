services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # this image has no arm64 build; Apple Silicon runs it emulated
    environment:
      POSTGRES_USER: corridor
      POSTGRES_PASSWORD: corridor_dev
      POSTGRES_DB: corridor
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - corridor_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corridor"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  corridor_db:
